# Blueprint Render GRATIS: pasang ZibbWash online tanpa kartu kredit (Render > New > Blueprint > pilih repo).
# Render gratis tidak punya disk permanen, jadi data disalin ke Upstash Redis (gratis, tanpa kartu):
# buat database di upstash.com, lalu isi dua nilai REST-nya saat Blueprint ini dibuat.
# Batasan paket gratis: layanan tidur setelah 15 menit tanpa pengunjung (pengunjung pertama menunggu hingga ±1 menit).
# Data tidak hilang saat tidur. Untuk tanpa tidur: ubah plan menjadi starter ($7/bulan), kode dan data tetap sama.
# Alternatif dengan disk permanen berbayar: deploy/render.starter.yaml.
services:
  - type: web
    name: zibbwash
    runtime: node
    plan: free
    region: singapore        # terdekat dari Indonesia; tidak bisa diubah setelah dibuat
    buildCommand: npm install # proyek tanpa dependensi, jadi ini hanya formalitas
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD            # kata sandi admin pilihanmu; hanya dipakai saat akun admin pertama dibuat
        sync: false
      - key: UPSTASH_REDIS_REST_URL    # dari konsol Upstash > database > REST API
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN  # idem; rahasia, jangan dibagikan
        sync: false
